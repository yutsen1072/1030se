<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動管理與報名</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background-color: #fafafa; }
    .card { background: #fff; border: 1px solid #e1e4e8; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    input, textarea { width: 100%; padding: 8px; margin: 6px 0 14px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background-color: #2da44e; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #2c974b; }
    button.btn-danger { background-color: #cf222e; }
    button.btn-danger:hover { background-color: #a40e26; }
  </style>
</head>
<body>

  <!-- guan 負責的區塊：發布活動 -->
  <div class="card">
    <h2>發布新活動（guan 管理模組）</h2>
    <label>活動名稱：</label>
    <input type="text" id="actTitle" placeholder="例如：迎新野餐趴">

    <label>活動描述：</label>
    <textarea id="actDesc" rows="3" placeholder="請輸入活動內容"></textarea>

    <label>活動日期：</label>
    <input type="datetime-local" id="actDate">

    <button onclick="createActivity()">發布活動</button>
  </div>

  <!-- guan 負責的區塊：手動截止活動 -->
  <div class="card">
    <h2>截止活動（guan 管理模組）</h2>
    <label>欲截止之活動 ID：</label>
    <input type="number" id="closeActId" placeholder="輸入活動 ID">
    <button class="btn-danger" onclick="closeActivity()">截止該活動</button>
  </div>

  <script>
    async function createActivity() {
      const title = document.getElementById('actTitle').value.trim();
      const description = document.getElementById('actDesc').value.trim();
      const event_date = document.getElementById('actDate').value;
      if (!title) return alert('請填寫活動名稱！');

      const res = await fetch('/api/activities', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, description, event_date })
      });
      const data = await res.json();
      if (res.ok) {
        alert(data.message + ' 新活動 ID 為: ' + data.id);
        document.getElementById('actTitle').value = '';
        document.getElementById('actDesc').value = '';
        document.getElementById('actDate').value = '';
      }
    }

    async function closeActivity() {
      const actId = document.getElementById('closeActId').value;
      if (!actId) return alert('請輸入活動 ID！');

      const res = await fetch(`/api/activities/${actId}/close`, { method: 'POST' });
      const data = await res.json();
      if (res.ok) {
        alert(data.message);
        document.getElementById('closeActId').value = '';
      }
    }
  </script>
</body>
</html>
